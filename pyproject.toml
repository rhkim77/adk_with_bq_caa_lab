[project]
name = "adk-local-web-workspace"
version = "0.1.0"
description = "Google ADK Local Web UI Workspace (macOS & Cloudtop compatible)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.8.30",
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "truststore>=0.10.0",
]

[tool.uv]
# Security & Compatibility Guardrails:
# 1) CVE-2026-49468 (b/572522296): Prevent uv from ever resolving or caching litellm < 1.84.0
# 2) Prevent mcp >= 2.0 breaking changes if mcp extra is installed
constraint-dependencies = [
    "litellm>=1.84.0",
    "mcp<2.0.0",
]

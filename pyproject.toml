[project]
name = "adk-local-web-workspace"
version = "0.1.0"
description = "Google ADK Local Web UI Workspace (macOS & Cloudtop compatible)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.8.30",
    "google-adk>=2.7.1",
    "google-genai>=1.0.0",
    "mcp==1.29.1",
    "python-dotenv>=1.0.1",
    "truststore>=0.10.0",
]

[tool.uv]
# Security Guardrail (CVE-2026-49468 / b/572522296):
# Prevent uv from ever resolving or caching litellm < 1.84.0 even if pulled transitively.
constraint-dependencies = [
    "litellm>=1.84.0",
]
